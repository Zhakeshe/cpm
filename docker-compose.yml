services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://crm:crm@postgres:5432/crm?schema=public
      SESSION_SECRET: change-me-to-a-long-random-secret-at-least-32-chars
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://crm:crm@postgres:5432/crm?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: change-me-to-a-long-random-secret-at-least-32-chars
      COOKIE_SECURE: "false"
      WHATSAPP_VERIFY_TOKEN: change-verify-token
      SIP_WEBHOOK_SECRET: change-sip-secret
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: node dist/worker.js
    environment:
      DATABASE_URL: postgresql://crm:crm@postgres:5432/crm?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: change-me-to-a-long-random-secret-at-least-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    volumes:
      - ./scripts:/scripts
      - backups:/backups
    environment:
      PGPASSWORD: crm
      BACKUP_RETENTION_DAYS: 14
    entrypoint: ["/scripts/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  minio:
  backups:
